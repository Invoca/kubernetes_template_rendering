---
common_config: &common_config
  agents:
    queue: "ruby-3-1"
  timeout_in_minutes: 5
steps:
- label: ":ruby: Ruby / ActiveSupport Test Matrix"
  timeout_in_minutes: 5
  plugins:
    - ssh://git@github.com/Invoca/invoca-ruby-test-matrix-buildkite-plugin.git#main:
        min_ruby_version: '3.3'
        slack_notification_channel: '#dev-pagerduty-release-engineering-octothorpeand-backend-platform-'
        # The plugin discovers gemfiles/*.gemfile for the ActiveSupport matrix.
        test_command: "bundle exec rspec"
